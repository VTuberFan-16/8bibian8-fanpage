<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비비안(8bibian8) 팬페이지</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #00c73c;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin: 10px 0;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            background-color: #00c73c;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            margin-bottom: 10px;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #00b034;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://placehold.co/120" alt="비비안 프로필" class="profile-img">
        <h1>SOOP 스트리머 비비안</h1>
        <p>8bibian8 팬페이지에 오신 것을 환영합니다! ✨</p>
        
        <!-- SOOP 방송국 링크 -->
        <a href="https://play.sooplive.co.kr/8bibian8" class="btn" target="_blank">📺 SOOP 방송국 바로가기</a>
    </div>
</body>
</html>
